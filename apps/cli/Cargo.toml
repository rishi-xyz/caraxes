[package]
name = "caraxes_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
caraxes_internal = { version = "0.1.0", path = "../../crates/internal" }
clap = {version = "4.6.7", features = ["derive"]}
dotenvy = "0.15.7"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.20"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[features]
default = ["dev-logs"]
# env-filter (and its regex stack) is only needed for on-demand RUST_LOG debugging.
dev-logs = ["tracing-subscriber/env-filter"]
